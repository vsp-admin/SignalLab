<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Симулятор функцій Уолша</title>
    <!-- ПРАВИЛЬНЕ ПІДКЛЮЧЕННЯ БІБЛІОТЕКИ CHART.JS -->
    <script src="https://jsdelivr.net"></script>
    <style>
        body { font-family: sans-serif; background: #f4f6f9; color: #333; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 700px; width: 100%; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); box-sizing: border-box; }
        h1 { font-size: 24px; text-align: center; margin-bottom: 20px; }
        .controls { display: flex; flex-direction: column; gap: 15px; margin-bottom: 25px; }
        .control-group { display: flex; align-items: center; justify-content: space-between; }
        label { font-weight: bold; }
        input[type="range"] { width: 60%; }
        .val-display { font-weight: bold; color: #007bff; width: 30px; text-align: right; }
    </style>
</head>
<body>

<div class="container">
    <h1>Симулятор функцій Уолша</h1>
    
    <div class="controls">
        <div class="control-group">
            <label for="orderInput">Порядок N (2^n):</label>
            <input type="range" id="orderInput" min="2" max="6" value="4" step="1">
            <span id="orderVal" class="val-display">16</span>
        </div>
        <div class="control-group">
            <label for="indexInput">Індекс функції (k):</label>
            <input type="range" id="indexInput" min="0" max="15" value="1" step="1">
            <span id="indexVal" class="val-display">1</span>
        </div>
    </div>

    <canvas id="walshChart"></canvas>
</div>

<script>
    // Функція генерації матриці Адамара (впорядкованої за Уолшем / за частотою змін знаку)
    function generateWalshVector(N, k) {
        let walsh = new Array(N).fill(1);
        for (let i = 0; i < N; i++) {
            let val = 0;
            // Переклад в код Грея для отримання саме функцій Уолша (sequency ordering)
            let gray = k ^ (k >> 1); 
            for (let j = 0; j < 32; j++) {
                if ((gray >> j) & 1) {
                    if ((i >> j) & 1) {
                        val++;
                    }
                }
            }
            walsh[i] = (val % 2 === 0) ? 1 : -1;
        }
        return walsh;
    }

    // Ініціалізація змінних
    const orderInput = document.getElementById('orderInput');
    const indexInput = document.getElementById('indexInput');
    const orderVal = document.getElementById('orderVal');
    const indexVal = document.getElementById('indexVal');
    const ctx = document.getElementById('walshChart').getContext('2d');
    
    let chart;

    function updateChart() {
        const p = parseInt(orderInput.value);
        const N = Math.pow(2, p); // Довжина сигналу (4, 8, 16, 32, 64)
        
        // Коригуємо макс. індекс під обрану довжину
        indexInput.max = N - 1;
        let k = parseInt(indexInput.value);
        if (k >= N) { k = N - 1; indexInput.value = k; }

        // Оновлюємо текст
        orderVal.textContent = N;
        indexVal.textContent = k;

        const walshData = generateWalshVector(N, k);
        
        // Формуємо масив точок для сходинкового (stepped) графіка
        const labels = [];
        const dataPoints = [];
        for(let i = 0; i < N; i++) {
            labels.push(i.toString());
            dataPoints.push(walshData[i]);
        }
        // Додаємо фінальну точку для візуального закриття графіка
        labels.push(N.toString());
        dataPoints.push(walshData[N-1]);

        if (chart) { chart.destroy(); }

        chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: `Walsh(k=${k}, N=${N})`,
                    data: dataPoints,
                    borderColor: '#007bff',
                    borderWidth: 3,
                    stepped: true, // Вмикаємо прямокутну форму сигналу
                    fill: false,
                    pointRadius: 0
                }]
            },
            options: {
                responsive: true,
                scales: {
                    y: { min: -1.5, max: 1.5, ticks: { stepSize: 1 } },
                    x: { title: { display: true, text: 'Дискретний час (n)' } }
                }
            }
        });
    }

    // Слухачі подій для повзунків
    orderInput.addEventListener('input', updateChart);
    indexInput.addEventListener('input', updateChart);

    // Перший запуск
    updateChart();
</script>

</body>
    </html>
