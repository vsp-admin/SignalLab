<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Симулятор функцій Уолша</title>
    <style>
        body { font-family: sans-serif; background: #f4f6f9; color: #333; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 700px; width: 100%; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); box-sizing: border-box; }
        h1 { font-size: 24px; text-align: center; margin-bottom: 20px; }
        .controls { display: flex; flex-direction: column; gap: 15px; margin-bottom: 25px; }
        .control-group { display: flex; align-items: center; justify-content: space-between; }
        label { font-weight: bold; }
        input[type="range"] { width: 60%; }
        .val-display { font-weight: bold; color: #007bff; width: 40px; text-align: right; }
        .canvas-container { width: 100%; position: relative; margin-top: 10px; }
        canvas { width: 100%; background: #ffffff; border: 1px solid #ddd; border-radius: 4px; display: block; }
    </style>
</head>
<body>

<div class="container">
    <h1>Симулятор функцій Уолша</h1>
    
    <div class="controls">
        <div class="control-group">
            <label for="orderInput">Порядок N (2^n):</label>
            <input type="range" id="orderInput" min="2" max="6" value="4" step="1">
            <span id="orderVal" class="val-display">16</span>
        </div>
        <div class="control-group">
            <label for="indexInput">Індекс функції (k):</label>
            <input type="range" id="indexInput" min="0" max="15" value="1" step="1">
            <span id="indexVal" class="val-display">1</span>
        </div>
    </div>

    <div class="canvas-container">
        <canvas id="walshCanvas" width="660" height="350"></canvas>
    </div>
</div>

<script>
    // Функція генерації вектора Уолша (sequency ordering через код Грея)
    function generateWalshVector(N, k) {
        let walsh = new Array(N).fill(1);
        for (let i = 0; i < N; i++) {
            let val = 0;
            let gray = k ^ (k >> 1); 
            for (let j = 0; j < 32; j++) {
                if ((gray >> j) & 1) {
                    if ((i >> j) & 1) {
                        val++;
                    }
                }
            }
            walsh[i] = (val % 2 === 0) ? 1 : -1;
        }
        return walsh;
    }

    const orderInput = document.getElementById('orderInput');
    const indexInput = document.getElementById('indexInput');
    const orderVal = document.getElementById('orderVal');
    const indexVal = document.getElementById('indexVal');
    const canvas = document.getElementById('walshCanvas');
    const ctx = canvas.getContext('2d');

    function drawChart() {
        const p = parseInt(orderInput.value);
        const N = Math.pow(2, p);
        
        indexInput.max = N - 1;
        let k = parseInt(indexInput.value);
        if (k >= N) { k = N - 1; indexInput.value = k; }

        orderVal.textContent = N;
        indexVal.textContent = k;

        const data = generateWalshVector(N, k);

        // Очищення полотна
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Відступи
        const paddingLeft = 50;
        const paddingRight = 30;
        const paddingTop = 40;
        const paddingBottom = 50;

        const chartWidth = canvas.width - paddingLeft - paddingRight;
        const chartHeight = canvas.height - paddingTop - paddingBottom;

        const centerY = paddingTop + chartHeight / 2;
        const scaleY = chartHeight / 2.5; // Масштаб для значень 1 та -1

        // 1. Малюємо сітку координат та осі
        ctx.strokeStyle = '#e2e8f0';
        ctx.lineWidth = 1;

        // Лінія для +1
        ctx.beginPath();
        ctx.moveTo(paddingLeft, centerY - scaleY);
        ctx.lineTo(canvas.width - paddingRight, centerY - scaleY);
        ctx.stroke();

        // Осьова лінія (0)
        ctx.strokeStyle = '#cbd5e1';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(paddingLeft, centerY);
        ctx.lineTo(canvas.width - paddingRight, centerY);
        ctx.stroke();

        // Лінія для -1
        ctx.strokeStyle = '#e2e8f0';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(paddingLeft, centerY + scaleY);
        ctx.lineTo(canvas.width - paddingRight, centerY + scaleY);
        ctx.stroke();

        // Підписи осі Y
        ctx.font = '14px sans-serif';
        ctx.fillStyle = '#64748b';
        ctx.textAlign = 'right';
        ctx.textBaseline = 'middle';
        ctx.fillText('1.0', paddingLeft - 10, centerY - scaleY);
        ctx.fillText('0.0', paddingLeft - 10, centerY);
        ctx.fillText('-1.0', paddingLeft - 10, centerY + scaleY);

        // Назва графіка зверху
        ctx.fillStyle = '#1e293b';
        ctx.font = 'bold 15px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(`Walsh (k = ${k}, N = ${N})`, canvas.width / 2, paddingTop - 15);

        // Підпис осі X знизу
        ctx.font = '13px sans-serif';
        ctx.fillStyle = '#64748b';
        ctx.fillText('Дискретний час (n)', canvas.width / 2, canvas.height - 15);

        // 2. Побудова сходинкового графіка функції Уолша
        const stepWidth = chartWidth / N;

        ctx.strokeStyle = '#007bff';
        ctx.lineWidth = 3;
        ctx.lineJoin = 'miter';
        ctx.beginPath();

        // ТЕПЕР ТОЧНО ВИПРАВЛЕНО: беремо перший елемент масиву data[0]
        let startY = centerY - (data[0] * scaleY);
        ctx.moveTo(paddingLeft, startY);

        for (let i = 0; i < N; i++) {
            const currentX = paddingLeft + (i * stepWidth);
            const nextX = paddingLeft + ((i + 1) * stepWidth);
            const targetY = centerY - (data[i] * scaleY);

            // Вертикальна сходинка (якщо рівень сигналу змінився)
            ctx.lineTo(currentX, targetY);
            // Горизонтальна лінія поточного інтервалу
            ctx.lineTo(nextX, targetY);

            // Мітки поділок на осі X
            if (N <= 16 || i % (N / 8) === 0 || i === N - 1) {
                ctx.save();
                ctx.strokeStyle = '#cbd5e1';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(currentX, centerY);
                ctx.lineTo(currentX, centerY + 5);
                ctx.stroke();

                ctx.fillStyle = '#64748b';
                ctx.font = '11px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(i.toString(), currentX, centerY + 20);
                ctx.restore();
            }
        }
        
        // Малюємо останню насічку на кінці осі X
        ctx.strokeStyle = '#cbd5e1';
        ctx.beginPath();
        ctx.moveTo(paddingLeft + chartWidth, centerY);
        ctx.lineTo(paddingLeft + chartWidth, centerY + 5);
        ctx.stroke();
        ctx.fillText(N.toString(), paddingLeft + chartWidth, centerY + 20);

        ctx.stroke();
    }

    orderInput.addEventListener('input', drawChart);
    indexInput.addEventListener('input', drawChart);

    // Первинне малювання
    drawChart();
</script>

</body>
</html>
